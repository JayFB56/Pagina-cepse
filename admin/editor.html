<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor — Panel CEPSE</title>
    <link rel="icon" type="image/x-icon" href="/assets/img/favicon.ico">
    <link rel="stylesheet" href="/admin/css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="/assets/img/favicon.ico" alt="CEPSE">
                <div class="brand">CEPSE<small>Panel administrativo</small></div>
            </div>

            <div class="sidebar-user">
                <div class="user-name" id="sb-username">—</div>
                <div class="user-role" id="sb-role">—</div>
            </div>

            <nav class="sidebar-nav">
                <div class="sidebar-section">
                    <a class="sidebar-link" href="/admin/dashboard.html">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                        Volver al panel
                    </a>
                </div>
            </nav>

            <div class="sidebar-footer">
                <button id="logout-btn" class="sidebar-link" style="color: var(--danger)">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
                    Cerrar sesión
                </button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title" id="editor-title">Nueva publicación</h1>
                    <p class="page-subtitle" id="editor-subtitle">Completa los campos para crear una entrada.</p>
                </div>
                <div class="flex gap-2">
                    <button id="cancel-btn" class="btn btn-secondary">Cancelar</button>
                    <button id="save-draft-btn" class="btn btn-secondary">Guardar borrador</button>
                    <button id="publish-btn" class="btn btn-primary">Publicar</button>
                </div>
            </div>

            <div id="editor-error" class="form-error hidden"></div>
            <div id="editor-success" class="form-success hidden"></div>

            <div class="editor-grid">
                <!-- ===== Columna principal ===== -->
                <div class="panel">
                    <div class="panel-body">
                        <div class="form-group">
                            <label class="form-label" for="title">Título *</label>
                            <input id="title" class="form-input" maxlength="200" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="summary">Resumen</label>
                            <textarea id="summary" class="form-textarea" rows="3" maxlength="500"
                                placeholder="Breve descripción que aparecerá en la tarjeta..."></textarea>
                            <p class="form-help">Máximo 500 caracteres. Se mostrará en el listado público.</p>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Contenido</label>
                            <div class="editor-container">
                                <div id="quill-editor"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ===== Columna lateral ===== -->
                <div>
                    <div class="panel">
                        <div class="panel-header"><h3 class="panel-title">Configuración</h3></div>
                        <div class="panel-body">
                            <div class="form-group">
                                <label class="form-label" for="section">Sección *</label>
                                <select id="section" class="form-select">
                                    <option value="noticias">Noticias</option>
                                    <option value="comunicados">Comunicados</option>
                                    <option value="eventos">Eventos</option>
                                    <option value="destacados">Destacados</option>
                                </select>
                            </div>

                            <div class="form-group" id="event-date-group" style="display:none">
                                <label class="form-label" for="event_date">Fecha del evento</label>
                                <input id="event_date" type="date" class="form-input">
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="status">Estado</label>
                                <select id="status" class="form-select">
                                    <option value="draft">Borrador</option>
                                    <option value="published">Publicado</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="panel">
                        <div class="panel-header"><h3 class="panel-title">Imagen destacada</h3></div>
                        <div class="panel-body">
                            <input type="file" id="image-input" class="form-input"
                                accept="image/jpeg,image/png,image/webp">
                            <p class="form-help">JPG, PNG o WEBP. Máx. 5 MB.</p>

                            <div class="image-preview" id="image-preview">
                                <span class="empty">Sin imagen seleccionada</span>
                            </div>

                            <input type="hidden" id="image_url">
                            <button id="remove-image-btn" class="btn btn-ghost btn-sm mt-2 hidden">Quitar imagen</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
    <script src="/admin/js/auth.js"></script>
    <script src="/admin/js/editor.js"></script>
</body>
</html>
