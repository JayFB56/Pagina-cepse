<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destacados — CEPSE</title>
    <link rel="icon" type="image/x-icon" href="/assets/img/favicon.ico">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        :root { --cepse-green: #006633; --cepse-gold: #d4af37; }
        body { font-family: 'Inter', sans-serif; }
        ::selection { background-color: var(--cepse-green); color: white; }

        .page-hero {
            background: linear-gradient(135deg, #006633 0%, #d4af37 200%), linear-gradient(135deg, #006633, #008844);
            color: white; padding: 4rem 1rem 3rem; text-align: center; position: relative; overflow: hidden;
        }
        .page-hero::before {
            content: '⭐'; position: absolute; font-size: 18rem; opacity: 0.06;
            right: -2rem; top: -3rem; pointer-events: none;
        }
        .page-hero h1 { font-family: 'Playfair Display', serif; font-size: 2.75rem; font-weight: 900; position: relative; }
        .page-hero p { color: rgba(255,255,255,0.9); max-width: 640px; margin: 0.75rem auto 0; position: relative; }

        .featured-card {
            background: white; border-radius: 1.25rem; overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            border: 1px solid #e5e7eb;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        .featured-card:hover { transform: translateY(-8px); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.18); border-color: var(--cepse-gold); }
        .featured-card .thumb { aspect-ratio: 16/9; overflow: hidden; background: linear-gradient(135deg, #006633, #008844); position: relative; }
        .featured-card .thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
        .featured-card:hover .thumb img { transform: scale(1.06); }
        .featured-card .thumb .badge {
            position: absolute; top: 0.85rem; left: 0.85rem; background: var(--cepse-gold); color: #1a2332;
            padding: 0.3rem 0.75rem; border-radius: 999px; font-size: 0.72rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        .featured-card .body { padding: 1.5rem; }
        .featured-card .meta { font-size: 0.78rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
        .featured-card h3 { font-size: 1.35rem; font-weight: 800; color: #0f172a; margin-top: 0.5rem; line-height: 1.3; font-family: 'Playfair Display', serif; }
        .featured-card .summary { color: #475569; font-size: 0.95rem; margin-top: 0.6rem; line-height: 1.6; }
        .featured-card .read-more { color: var(--cepse-green); font-weight: 700; font-size: 0.9rem; margin-top: 1rem; display: inline-block; }

        .featured-card.first {
            grid-column: span 2;
        }
        .featured-card.first .thumb { aspect-ratio: 21/9; }
        .featured-card.first h3 { font-size: 1.75rem; }

        @media (max-width: 768px) {
            .featured-card.first { grid-column: span 1; }
        }

        .modal-backdrop {
            position: fixed; inset: 0; background: rgba(15,23,42,0.7); z-index: 1000;
            display: none; align-items: center; justify-content: center; padding: 1rem;
            backdrop-filter: blur(4px);
        }
        .modal-backdrop.open { display: flex; }
        .modal-card {
            background: white; max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto;
            border-radius: 1rem; padding: 2rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.4);
        }
        .modal-card h2 { font-family: 'Playfair Display', serif; font-size: 1.75rem; font-weight: 900; color: var(--cepse-green); }
        .modal-card .modal-meta { color: #64748b; font-size: 0.85rem; margin-top: 0.25rem; }
        .modal-card .modal-image img { width: 100%; border-radius: 0.5rem; margin-top: 1rem; }
        .modal-card .modal-content { margin-top: 1.25rem; color: #1f2937; line-height: 1.7; }
        .modal-card .modal-content p { margin-bottom: 0.75rem; }
        .modal-card .modal-close {
            float: right; background: #f3f4f6; border: none; padding: 0.4rem 0.75rem;
            border-radius: 0.5rem; cursor: pointer; font-weight: 600; color: #475569;
        }

        .empty-block {
            text-align: center; padding: 4rem 1rem; color: #64748b;
            background: white; border-radius: 1rem; border: 1px dashed #cbd5e1;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="header-container"></div>

    <main>
        <section class="page-hero">
            <h1>Destacados</h1>
            <p>Las publicaciones más relevantes de CEPSE: logros, alianzas estratégicas e historias que marcan el camino de la economía popular y solidaria.</p>
        </section>

        <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
            <div id="posts-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="col-span-full text-center py-16 text-gray-500">Cargando destacados...</div>
            </div>
        </section>
    </main>

    <div id="footer-container"></div>

    <div class="modal-backdrop" id="modal">
        <div class="modal-card">
            <button class="modal-close" id="modal-close">✕ Cerrar</button>
            <div id="modal-body" style="clear: both"></div>
        </div>
    </div>

    <script>
        const SECTION = 'destacados';
        const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:3000'
            : '';  // Empty string en producción = usa proxy de Vercel

        function loadComponent(containerId, filePath) {
            fetch(filePath)
                .then(r => r.text())
                .then(html => { document.getElementById(containerId).innerHTML = html; })
                .catch(err => console.error('Error loading component:', err));
        }
        loadComponent('header-container', '/components/header.html');
        loadComponent('footer-container', '/components/footer.html');

        function escapeHtml(s) {
            if (s == null) return '';
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function formatDate(s) {
            if (!s) return '';
            const d = new Date(s.replace(' ', 'T') + (s.includes('Z') ? '' : 'Z'));
            if (isNaN(d.getTime())) return '';
            return d.toLocaleDateString('es-EC', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        function imageUrl(url) {
            if (!url) return '';
            return url.startsWith('http') ? url : `${API_BASE}${url}`;
        }

        async function loadPosts() {
            const grid = document.getElementById('posts-grid');
            try {
                const res = await fetch(`${API_BASE}/api/public/posts?section=${SECTION}&limit=30`);
                const data = await res.json();
                if (!data.success || !data.data || data.data.length === 0) {
                    grid.innerHTML = `<div class="col-span-full empty-block">
                        <p class="text-lg font-semibold">Aún no hay contenido destacado.</p>
                        <p class="text-sm mt-2">Pronto compartiremos las historias más relevantes.</p>
                    </div>`;
                    return;
                }

                grid.innerHTML = data.data.map((p, i) => `
                    <article class="featured-card ${i === 0 ? 'first' : ''}" data-id="${p.id}">
                        <div class="thumb">
                            ${p.image_url
                                ? `<img src="${imageUrl(p.image_url)}" alt="${escapeHtml(p.title)}">`
                                : `<div class="w-full h-full flex items-center justify-center text-white/30 text-7xl">⭐</div>`}
                            <span class="badge">Destacado</span>
                        </div>
                        <div class="body">
                            <div class="meta">${formatDate(p.published_at || p.created_at)}</div>
                            <h3>${escapeHtml(p.title)}</h3>
                            <p class="summary">${escapeHtml((p.summary || '').slice(0, 220))}${p.summary && p.summary.length > 220 ? '...' : ''}</p>
                            <span class="read-more">Leer historia completa →</span>
                        </div>
                    </article>
                `).join('');

                grid.querySelectorAll('.featured-card').forEach(card => {
                    const id = card.dataset.id;
                    const post = data.data.find(p => p.id == id);
                    card.addEventListener('click', () => openModal(post));
                });
            } catch (err) {
                console.error(err);
                grid.innerHTML = `<div class="col-span-full empty-block">
                    <p class="text-lg font-semibold">No fue posible cargar los destacados.</p>
                    <p class="text-sm mt-2">Intenta nuevamente más tarde.</p>
                </div>`;
            }
        }

        function openModal(post) {
            const body = document.getElementById('modal-body');
            body.innerHTML = `
                <h2>${escapeHtml(post.title)}</h2>
                <div class="modal-meta">${formatDate(post.published_at || post.created_at)}</div>
                ${post.image_url ? `<div class="modal-image"><img src="${imageUrl(post.image_url)}" alt=""></div>` : ''}
                <div class="modal-content">${post.content || ('<p>' + escapeHtml(post.summary || '') + '</p>')}</div>
            `;
            document.getElementById('modal').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('open');
            document.body.style.overflow = '';
        }

        document.getElementById('modal-close').addEventListener('click', closeModal);
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') closeModal();
        });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

        loadPosts();
    </script>
    <script src="/js/interactions.js"></script>
</body>
</html>
