<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autoridades</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body>
    <div id="header-container"></div>
    <main class="flex items-center justify-center min-h-screen bg-gray-50">
        <h1 class="text-6xl font-bold text-center text-gray-800">Autoridades</h1>
    </main>
    <div id="footer-container"></div>
    <script src="../../js/interactions.js"></script>
    <script>
        function loadComponent(containerId, filePath, level = 0) {
            const adjustPath = (path, level) => {
                const prefix = '../'.repeat(level);
                return prefix + path;
            };
            fetch(adjustPath(filePath, level))
                .then(response => response.text())
                .then(data => {
                    document.getElementById(containerId).innerHTML = data;
                })
                .catch(error => console.error('Error loading component:', error));
        }
        loadComponent('header-container', 'components/header.html', 2);
        loadComponent('footer-container', 'components/footer.html', 2);
    </script>
</body>
</html>
